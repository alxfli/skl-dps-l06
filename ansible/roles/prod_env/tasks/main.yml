---
- name: Install JDK and Tomcat
  ansible.builtin.apt:
    name: "{{ tomcat_packages }}"
    state: present
    update_cache: true

- name: Remove old ROOT directory
  ansible.builtin.file:
    path: "{{ root_dir }}"
    state: absent

- name: Deploy WAR as ROOT
  ansible.builtin.copy:
    src: "{{ war_source }}"
    dest: "{{ war_dest }}"
    owner: tomcat
    group: tomcat
    mode: "0644"
  notify: Restart Tomcat

- name: Ensure Tomcat is enabled and started
  ansible.builtin.systemd:
    name: "{{ tomcat_service }}"
    enabled: true
    state: started
