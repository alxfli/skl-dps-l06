---
- name: Install Docker prerequisites
  apt: { name: [ca-certificates, curl, gnupg], state: present, update_cache: true }

- name: Add Docker GPG key
  shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc
  args:
    creates: /etc/apt/keyrings/docker.asc

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch={{ ansible_facts['architecture'] | replace('x86_64','amd64') | replace('aarch64','arm64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    state: present
    update_cache: true

- name: Install Docker Engine
  apt: { name: [docker-ce, docker-ce-cli, containerd.io], state: present }

- name: Enable and start Docker
  systemd: { name: docker, enabled: true, state: started }