---
- name: Install JDK and Tomcat
  ansible.builtin.apt:
    name: "{{ tomcat_packages }}"
    state: present
    update_cache: true

- name: Workaround for empty policy.d in tomcat10 (Ubuntu 26.04)
  ansible.builtin.file:
    path: "{{ policy_placeholder }}"
    state: touch
    owner: root
    group: tomcat
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Remove old ROOT directory
  ansible.builtin.file:
    path: "{{ root_dir }}"
    state: absent

- name: Deploy WAR as ROOT
  ansible.builtin.copy:
    src: "{{ war_source }}"
    dest: "{{ war_dest }}"
    owner: tomcat
    group: tomcat
    mode: "0644"
  notify: Restart Tomcat

- name: Ensure Tomcat is enabled and started
  ansible.builtin.systemd:
    name: "{{ tomcat_service }}"
    enabled: true
    state: started
